# Trigger build

name: Update README from JSON

on:
  push:
    paths:
      - "profile.json"
      - "build.js"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Build Script
        run: node build.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "ylyamartchenko@gmail.com"
          git config --local user.name "YlyaBot"
          git add README.md

          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update README via profile.json" && git push)
