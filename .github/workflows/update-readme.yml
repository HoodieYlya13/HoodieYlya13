name: Update Profile and README

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - "profile.json"
      - "build.js"
      - "sync-pins.js"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync GitHub Pinned Repos to JSON
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: node sync-pins.js

      - name: Run Build Script
        run: node build.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "ylyamartchenko@proton.me"
          git config --local user.name "YlyaBot"

          git add profile.json README.md

          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync profile pins & build README" && git push)
